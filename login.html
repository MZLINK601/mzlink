<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - MZLINK</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f1115 0%, #1a1d24 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(212, 175, 55, 0.2);
            position: relative;
            overflow: hidden;
            animation: subirCard 0.6s ease-out;
        }

        /* Detalhe Dourado no Topo */
        .auth-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
        }

        @keyframes subirCard {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-mzlink {
            display: block;
            text-align: center;
            font-size: 1.8rem;
            font-weight: 900;
            color: #0f1115;
            text-decoration: none;
            letter-spacing: -0.5px;
            margin-bottom: 5px;
        }

        .logo-mzlink span { color: #d4af37; }

        .subtitulo {
            text-align: center;
            color: #667085;
            font-size: 0.9rem;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 800;
            color: #0f1115;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            background: #f8f9fb;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: #d4af37;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
        }

        input#codigo {
            text-align: center;
            font-size: 1.5rem;
            letter-spacing: 6px;
            font-weight: 900;
            color: #d4af37;
        }

        .btn-principal {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #0f1115, #1a1d24);
            color: #d4af37;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(15, 17, 21, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-principal:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(15, 17, 21, 0.4);
        }

        .btn-principal:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .msg-erro { color: #dc2626; font-size: 0.85rem; font-weight: bold; text-align: center; margin-top: 10px; min-height: 20px; }
        .msg-sucesso { color: #16a34a; font-size: 0.85rem; font-weight: bold; text-align: center; margin-top: 10px; min-height: 20px; }

        .divisor-whatsapp {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px dashed #cbd5e1;
            text-align: center;
        }

        .divisor-whatsapp p {
            color: #667085;
            font-size: 0.85rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .btn-whatsapp {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid #25D366;
            background: #fff;
            color: #25D366;
            font-weight: 800;
            font-size: 0.95rem;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-whatsapp:hover { background: #25D366; color: white; }
        
        .btn-voltar {
            display: inline-block;
            text-align: center;
            width: 100%;
            margin-top: 20px;
            color: #94a3b8;
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: 600;
        }
        .btn-voltar:hover { color: #d4af37; }
    </style>
</head>
<body>

    <div class="auth-container">
        <a href="index.html" class="logo-mzlink">MZ<span>LINK</span></a>
        <p class="subtitulo">Encontre, Compare, Resolva. <br> A plataforma 100% moçambicana. 🇲🇿</p>

        <!-- PASSO 1: Pedir o Email -->
        <form id="formEmail">
            <div class="form-group">
                <label for="email">Endereço de E-mail</label>
                <input type="email" id="email" placeholder="seunome@exemplo.com" required>
            </div>
            <button type="submit" id="btnPedirCodigo" class="btn-principal">📩 Receber Código de Acesso</button>
            <p id="msgPrincipal" class="msg-erro"></p>
        </form>

        <!-- PASSO 2: Inserir o Código -->
        <form id="formCodigo" style="display: none;">
            <div class="form-group">
                <label for="codigo">Código de 8 dígitos</label>
                <input type="text" id="codigo" placeholder="00000000" required maxlength="8" inputmode="numeric">
                <p style="font-size: 0.75rem; color: #94a3b8; margin-top: 5px; text-align: center;">Verifica a tua caixa de entrada (e o Spam).</p>
            </div>
            <button type="submit" id="btnEntrarOtp" class="btn-principal">✅ Entrar na Plataforma</button>
            <p id="msgCodigo" class="msg-erro"></p>
        </form>

        <!-- APOIO WHATSAPP PARA EMPRESAS -->
        <div class="divisor-whatsapp">
            <p>Tens uma empresa ou negócio?</p>
            <a href="https://wa.me/258852337913?text=Ol%C3%A1%2C%20Equipa%20MZLINK!%20Quero%20cadastrar%20o%20meu%20neg%C3%B3cio." target="_blank" class="btn-whatsapp">
                💬 Cadastrar via WhatsApp
            </a>
        </div>

        <a href="index.html" class="btn-voltar">← Voltar à página inicial</a>
    </div>

    <script src="login.js"></script>
</body>
</html>
