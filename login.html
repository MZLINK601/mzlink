<!DOCTYPE html>
<html lang="pt">
    <head> 
        <meta charset=""UTF-8>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Entrar - MZLINK</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="auth-page">

        <div class="auth-card">
            <a href="Index.html" class="autth-logo">MZLINK</a>
            <H2>Entrar na sua conta</H2>

            <form id="loginForm">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="seuemail@exemplo.com" required>


                <label for="password">Palavra-passe</label>
                <input type="password" id="password" placeholder="Sua Palavra-passe" required>

                <button type="submit">Entrar</button>
                <p id="message"></p>
            </form>

            <p class="auth-link">Ainda não tem conta? <a href="registo.html">Criar conta</a></p>
        </div>

        <script src="login.js"></script>
    </body>
</html>
