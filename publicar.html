<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar anúncio - MZLINK</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="fotos.css">
    <link rel="stylesheet" href="modo-premium.css">
</head>
<body class="auth-page">

    <div class="publicar-wrap">

        <div class="auth-card">
            <a href="index.html" class="auth-logo">MZLINK</a>
            <h2>Publicar anúncio</h2>

            <form id="publicarForm">
                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Ex: João Silva" required maxlength="60">

                <label for="tipo">O que oferece</label>
                <input type="text" id="tipo" placeholder="Ex: Eletricista, Roupa, Aulas de inglês" required maxlength="60">

                <label for="local">Local</label>
                <input type="text" id="local" placeholder="Ex: Maputo, Matola" required maxlength="60">

                <label for="categoria">Categoria</label>
                <select id="categoria" required>
                    <option value="">Escolha uma opção</option>
                    <option value="produtos">Produtos</option>
                    <option value="servicos">Serviços</option>
                    <option value="vendedores">Vendedores</option>
                    <option value="profissionais">Profissionais</option>
                    <option value="instituicoes">Instituições</option>
                    <option value="empresas">Empresas</option>
                </select>

                <label for="whatsapp">WhatsApp</label>
                <input type="tel" id="whatsapp" placeholder="84 123 4567" required>

                <label for="preco">Preço (MT) — opcional</label>
                <input type="number" id="preco" placeholder="Ex: 1500 (deixa vazio se for a combinar)">

                <!-- ===== Secção de Fotos ===== -->
                <div class="fotos-section" id="fotosSection">

                    <div class="fotos-header">
                        <h3 class="fotos-titulo">
                            <span class="icone">📸</span>
                            Fotos do anúncio
                        </h3>
                        <span class="fotos-contador-badge" id="contadorFotos">0/4</span>
                    </div>

                    <div class="fotos-info" id="fotosInfo">
                        🆓 Plano <strong>Básico</strong>: até 4 fotos.
                        <a href="premium.html">Tornar-se Premium</a>
                    </div>

                    <div class="fotos-vazio" id="fotosVazio">
                        <div class="icone-vazio">🖼️</div>
                        <div class="texto-vazio">
                            Ainda não adicionaste fotos.<br>
                            Adiciona até <strong id="limiteTexto">4 fotos</strong> para o teu anúncio.
                        </div>
                    </div>

                    <input type="file" id="inputFotos" accept="image/*" multiple hidden>

                    <div id="previewFotos"></div>

                    <button type="button" id="btnAdicionarFoto" class="btn-add-foto">
                        Adicionar foto
                    </button>

                    <div class="fotos-aviso" id="fotosAviso">
                        <span class="emoji">👑</span>
                        <span>
                            Limite atingido! <a href="premium.html">Torna-te Premium</a>
                            para publicar até <strong>20 fotos</strong>.
                        </span>
                    </div>

                </div>
                <!-- ===== Fim Secção de Fotos ===== -->

                <button type="submit">Publicar</button>
                <p id="message"></p>
            </form>
        </div>

        <div class="auth-card">
            <h2>Os meus anúncios</h2>
            <div id="meusAnuncios"><p>A carregar...</p></div>
        </div>

        <a class="voltar" href="index.html">Voltar à página inicial</a>

    </div>

    <script src="sessao.js" charset="UTF-8"></script>
    <script src="publicar.js" charset="UTF-8"></script>
    <script src="modo-premium.js"></script>
</body>
</html>
