<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar palavra-passe - MZLINK</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .voltar { display: block; text-align: center; margin-top: 16px; color: #1d4ed8; font-weight: 600; text-decoration: none; }
    .ajuda { color: #6b7280; font-size: 14px; text-align: center; margin: 0 0 12px 0; }
  </style>
</head>
<body class="auth-page">

  <div class="auth-card">
    <a href="index.html" class="auth-logo">MZLINK</a>
    <h2>Recuperar palavra-passe</h2>
    <p class="ajuda">Escreva o email da sua conta. Vamos enviar um link para criar uma nova palavra-passe.</p>

    <form id="esqueciForm">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="seuemail@exemplo.com" required>

      <button type="submit">Enviar link</button>
      <p id="message"></p>
    </form>

    <a class="voltar" href="login.html">Voltar ao login</a>
  </div>

  <script src="sessao.js" charset="UTF-8"></script>
  <script src="esqueci.js" charset="UTF-8"></script>
</body>
</html>
