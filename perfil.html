<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil — MZLINK</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: #f8f9fb;
        color: #1a1a1a;
        line-height: 1.6;
        min-height: 100vh;
      }
      .header {
        background: #fff;
        padding: 14px 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,.05);
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .header img { height: 38px; }
      .header a.voltar {
        color: #0066ff;
        text-decoration: none;
        font-weight: 800;
        font-size: 0.9rem;
      }
      .container {
        max-width: 560px;
        margin: 0 auto;
        padding: 24px 16px 60px;
      }
      .hero { text-align: center; padding: 20px 0 24px; }
      .avatar-grande {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: linear-gradient(135deg, #0066ff, #3b82f6);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 2.5rem;
        font-weight: 900;
        margin: 0 auto 12px;
        box-shadow: 0 8px 24px rgba(0,102,255,.25);
        border: 4px solid #fff;
      }
      .avatar-grande.premium {
        background: linear-gradient(135deg, #d4af37, #f5d76e);
        color: #1a1a1a;
        box-shadow: 0 8px 24px rgba(212,175,55,.4);
      }
      .hero h1 {
        font-size: 1.4rem;
        font-weight: 900;
        color: #0f1115;
        margin-bottom: 4px;
      }
      .hero .email {
        font-size: 0.85rem;
        color: #667085;
        margin-bottom: 12px;
      }
      .plano-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 16px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 900;
        letter-spacing: 0.5px;
      }
      .plano-badge.basico { background: #f0f4f9; color: #667085; }
      .plano-badge.premium {
        background: linear-gradient(135deg, #d4af37, #f5d76e);
        color: #1a1a1a;
        box-shadow: 0 4px 12px rgba(212,175,55,.35);
      }
      .card {
        background: #fff;
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 14px;
        box-shadow: 0 4px 16px rgba(0,0,0,.04);
        border: 1px solid #eef1f5;
      }
      .card h2 {
        font-size: 0.8rem;
        font-weight: 800;
        color: #667085;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 14px;
      }
      .campo {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid #f8f9fb;
      }
      .campo:last-child { border-bottom: none; }
      .campo-info { flex: 1; min-width: 0; }
      .campo-info label {
        display: block;
        font-size: 0.72rem;
        color: #98a2b3;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 2px;
      }
      .campo-info .valor {
        font-size: 0.95rem;
        font-weight: 700;
        color: #0f1115;
        word-break: break-word;
      }
      .campo-info .valor.bloqueado { color: #98a2b3; font-weight: 600; }
      .btn-editar {
        padding: 8px 14px;
        background: #f0f4f9;
        color: #0066ff;
        border: none;
        border-radius: 8px;
        font-size: 0.78rem;
        font-weight: 800;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.2s;
        white-space: nowrap;
      }
      .btn-editar:hover { background: #e2e9f2; }
      .btn-acao {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        font-size: 0.9rem;
        font-weight: 800;
        cursor: pointer;
        font-family: inherit;
        text-decoration: none;
        transition: all 0.2s;
        margin-top: 8px;
      }
      .btn-acao.principal {
        background: linear-gradient(135deg, #0066ff, #3b82f6);
        color: #fff;
        box-shadow: 0 6px 16px rgba(0,102,255,.25);
      }
      .btn-acao.principal:hover { transform: translateY(-2px); }
      .btn-acao.sair { background: #f0f4f9; color: #667085; }
      .aviso {
        text-align: center;
        padding: 12px;
        border-radius: 10px;
        font-size: 0.85rem;
        font-weight: 700;
        margin-top: 10px;
        display: none;
      }
      .aviso.visivel { display: block; }
      .aviso.ok { background: #d1f7dc; color: #0a7a33; }
      .aviso.erro { background: #fde2e2; color: #b42318; }
      .loading {
        text-align: center;
        padding: 40px 20px;
        color: #667085;
        font-weight: 600;
      }
      .btn-voltar {
        display: block;
        text-align: center;
        margin-top: 20px;
        padding: 14px 28px;
        background: #fff;
        color: #667085;
        font-weight: 800;
        text-decoration: none;
        border-radius: 12px;
        border: 1px solid #eef1f5;
        transition: all 0.2s;
      }
      .btn-voltar:hover { border-color: #d4af37; color: #a8842c; }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html"><img src="logo-mzlink.png" alt="MZLINK"></a>
        <a href="index.html" class="voltar">← Início</a>
    </header>

    <main class="container" id="conteudo">
        <div class="loading">A carregar perfil...</div>
    </main>

    <script src="sessao.js" charset="UTF-8"></script>
    <script src="perfil.js"></script>

</body>
</html>
