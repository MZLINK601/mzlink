<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width-device-width, initial-scale=1.0">
        <title>Criar conta - MZLINK</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="auth-page">

        <div class="auth-card">
            <a href="Index.html" class="autth-logo">MZLINK</a>
            <h2>Criar conta</h2>


            <form id="registerForm">
                <label for="accountType">Tipo de conta</label>
                <select id="accountType" required>
                    <option value="">Escolha uma opção</option>
                    <option value="Cliente">Cliente(quero encontrar)</option>
                    <option value="Vendedor">Vendedor</option>
                    <option value="Profissional">Profissional</option>
                    <option value="Empresa">Empresa</option>
                </select>

                <label for="name">Nome</label>
                <input type="text" id="name" placeholder="Seu nome" required>
                
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="seuemail@exemplo.com" aria-required>

                <label for="phone">WhatsApp</label>
                <input type="tel" id="phone" placeholder="84 123 4567" required>

                <label for="password">Palavra-passe</label>
                <input type="password" id="password" placeholder="Minimos 6 caracteres" required>

                <label for="confirmPassword">Confirmar Palavra-passe</label>
                <input type="password" id="confirmPassword" placeholder="Repita a Palavra-passe" required>

                <button type="submit">Criar conta</button>
                <p id="message"></p>
            </form>

            <p class="auth-link">Ja tem conta? <a href="login.html">Entrar</a></p>
        </div>

        <script src="registo.js"></script>
    </body>
</html>
