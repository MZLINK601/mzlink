<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Criar conta - MZLINK</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="auth-page">

        <div class="auth-card">
            <a href="index.html" class="auth-logo">MZLINK</a>
            <h2>Criar conta / Entrar</h2>

            <!-- PASSO 1: Pedir o Email -->
            <form id="formEmail">
                <label for="email">O teu Email</label>
                <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
                <button type="submit" id="btnEnviarCodigo">Receber Código</button>
                <p id="msgEmail" style="color:red; margin-top:10px; font-weight:bold;"></p>
            </form>

            <!-- PASSO 2: Inserir o Código (Escondido no início) -->
            <form id="formCodigo" style="display: none; margin-top: 20px;">
                <label for="codigo">Insere o código que recebeste no email</label>
                <input type="text" id="codigo" placeholder="Código do email" required maxlength="10">
                <button type="submit" id="btnEntrar">Entrar na Conta</button>
                <p id="msgCodigo" style="color:red; margin-top:10px; font-weight:bold;"></p>
            </form>

            <p class="auth-link">Já tem conta? <a href="login.html">Entrar com Palavra-passe</a></p>

            <!-- Botão do WhatsApp para Empresas (Mantido) -->
            <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid #eef1f5;">
                <p style="color: #667085; margin-bottom: 12px; font-weight: 600; font-size: 0.9rem;">
                    É dono de um negócio e quer um perfil profissional?
                </p>
                <a href="https://wa.me/258852337913?text=Ol%C3%A1%2C%20Am%C3%B3s!%20Quero%20cadastrar%20a%20minha%20empresa%20no%20MZLINK." 
                   target="_blank" 
                   style="display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 16px; background: #25D366; color: white; font-weight: 800; font-size: 1rem; text-decoration: none; border-radius: 12px; box-shadow: 0 8px 24px rgba(37,211,102,0.3);">
                    💬 Cadastrar via WhatsApp
                </a>
            </div>
        </div>

        <script src="registo.js"></script>
    </body>
</html>
