<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MZLINK — Encontre produtos, serviços e profissionais perto de si em Moçambique.">
    <title>MZLINK</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cartoes.css">
    <link rel="stylesheet" href="premium-cards.css">
    <link rel="stylesheet" href="avaliacoes.css">
    <link rel="stylesheet" href="modo-premium.css">
    <link rel="stylesheet" href="fotos-cards.css">
    <link rel="stylesheet" href="galeria.css">

    <style>
      /* ===== GALERIA — Estilos críticos inline ===== */
      .foto-principal-card {
        cursor: pointer !important;
        -webkit-tap-highlight-color: transparent !important;
        -webkit-touch-callout: none !important;
        user-select: none !important;
        touch-action: manipulation !important;
        position: relative !important;
      }

      .icone-zoom {
        position: absolute !important;
        bottom: 12px !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
        background: rgba(15, 17, 21, 0.85) !important;
        color: #fff !important;
        font-size: 0.75rem !important;
        font-weight: 800 !important;
        padding: 6px 14px !important;
        border-radius: 999px !important;
        backdrop-filter: blur(8px) !important;
        pointer-events: none !important;
        white-space: nowrap !important;
        z-index: 5 !important;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3) !important;
      }

      @media (max-width: 640px) {
        .icone-zoom {
          opacity: 1 !important;
          font-size: 0.72rem !important;
          padding: 5px 12px !important;
        }
        .foto-principal-card:active {
          transform: scale(0.98) !important;
          transition: transform 0.1s !important;
        }
      }

      @media (min-width: 641px) {
        .icone-zoom {
          opacity: 0;
          transition: opacity 0.25s !important;
          top: 50% !important;
          bottom: auto !important;
          transform: translate(-50%, -50%) !important;
        }
        .foto-principal-card:hover .icone-zoom {
          opacity: 1;
        }
      }
    </style>
</head>

<body>

    <header>
        <div class="header-topo">
            <a href="index.html" class="logo-header">MZLINK</a>
            <span class="saudacao">
                Olá, <span id="nomeUserTopo">...</span>
                <span data-badge-premium></span>
            </span>
        </div>

        <nav>
            <button onclick="location.href='premium.html'" class="btn-premium">⭐ Premium</button>
            <button onclick="location.href='login.html'">Entrar</button>
            <button onclick="location.href='registo.html'">Criar conta</button>
        </nav>
    </header>

    <main>
        <h1>MZLINK</h1>
        <h2>Encontre, Compare, Resolva.</h2>
        <p>Encontre produtos, serviços, vendedores e profissionais.</p>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="O que você precisa encontrar?">
            <button id="searchButton">Pesquisar</button>
        </div>

        <div id="results"></div>

        <h2>Categorias</h2>
        <div class="categorias">
            <button data-categoria="produtos">Produtos</button>
            <button data-categoria="servicos">Serviços</button>
            <button data-categoria="vendedores">Vendedores</button>
            <button data-categoria="profissionais">Profissionais</button>
            <button data-categoria="instituicoes">Instituições</button>
            <button data-categoria="empresas">Empresas</button>
        </div>

        <div class="cards">
            <div class="card"><h3>Encontre</h3><p>Milhares de produtos perto de si</p></div>
            <div class="card"><h3>Compare</h3><p>Compare preços e avaliações</p></div>
            <div class="card"><h3>Resolva</h3><p>Resolva a sua necessidade com confiança</p></div>
        </div>
    </main>

    <script src="script.js"></script>
    <script src="sessao.js" charset="UTF-8"></script>
    <script src="js/badge-premium.js"></script>
    <script src="avaliacoes.js"></script>
    <script src="modo-premium.js"></script>
    <script src="galeria.js"></script>
</body>
</html>
